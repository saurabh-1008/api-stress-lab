[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "api-stress-lab"
dynamic = ["version"]
description = "Config-driven async API reliability and load testing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["api", "load-testing", "performance", "http", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "build>=1.2.0",
  "twine>=6.0.0",
  "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/saurabh-1008/api-stress-lab"
Repository = "https://github.com/saurabh-1008/api-stress-lab"
Documentation = "https://github.com/saurabh-1008/api-stress-lab/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/saurabh-1008/api-stress-lab/issues"

[project.scripts]
api-stress-lab = "api_stress_lab.cli:main"

[tool.setuptools.packages.find]
include = ["api_stress_lab*"]

[tool.setuptools.dynamic]
version = {attr = "api_stress_lab.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["."]
