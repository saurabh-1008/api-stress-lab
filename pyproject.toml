[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-stress-lab"
version = "0.1.0"
description = "Config-driven async API reliability and load testing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-httpx>=0.30.0",
]

[project.scripts]
api-stress-lab = "api_stress_lab.cli:main"

[tool.setuptools.packages.find]
include = ["api_stress_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
asyncio_default_fixture_loop_scope = "function"
